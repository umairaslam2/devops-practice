name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Node Setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install deps
      - name: Install dependencies
        run: npm install

      # # 4️⃣ Lint
      # - name: Run ESLint
      #   run: npm run lint

      # # 5️⃣ Test
      # - name: Run Tests
      #   run: npm test

      # 6️⃣ Docker Login
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7️⃣ Build Image
      - name: Build Docker Image
        run: |
          docker build -t umairaslam2/devops-node-app:${{ github.sha }} .
          docker tag umairaslam2/devops-node-app:${{ github.sha }} umairaslam2/devops-node-app:latest

      # 8️⃣ Security Scan
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: umairaslam2/devops-node-app:latest
          severity: HIGH,CRITICAL
          exit-code: 1

      # 9️⃣ Push Image
      - name: Push Docker Image
        run: |
          docker push umairaslam2/devops-node-app:${{ github.sha }}
          docker push umairaslam2/devops-node-app:latest

      # # 🔟 Deploy to Kubernetes
