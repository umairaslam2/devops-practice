# Workflow ka naam (GitHub Actions UI mein show hota hai)
name: CI/CD Pipeline

# Kab trigger ho?
# Jab bhi main branch pe push ho
on:
  push:
    branches:
      - main

#####################################
# JOB 1: CI (Lint + Test)
#####################################
jobs:
  ci:
    name: Continuous Integration (Lint & Test)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Repository ka code runner machine pe
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Node.js environment setup 
      - name: Setup Node.js (v18)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Step 3: Project dependencies installation
      - name: Install NPM dependencies
        run: npm install

      # Step 4: Code quality check (ESLint)
      # Agar lint fail hua → pipeline yahin fail ho jayegi
      - name: Run ESLint
        run: npm run lint

      # Step 5: Automated tests run (Jest)
      # Tests fail → Docker build nahi hoga
      - name: Run Unit Tests
        run: npm test

#####################################
# JOB 2: Docker Build & Push
#####################################
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    # IMPORTANT:
    # Yeh job tabhi chalegi jab CI job SUCCESS ho
    needs: ci

    steps:
      # Step 1: Code phir se checkout (har job fresh runner hota hai)
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: DockerHub login
      # Credentials GitHub Secrets se aate hain (secure)
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Docker image building
      # Image ko commit SHA ke sath tag kara hai (rollback ke liye best practice)
      - name: Build Docker Image
        run: |
          docker build -t umairaslam2/devops-node-app:${{ github.sha }} .
          docker tag umairaslam2/devops-node-app:${{ github.sha }} umairaslam2/devops-node-app:latest

      # Step 4: Docker image push DockerHub pe
      - name: Push Docker Image to DockerHub
        run: |
          docker push umairaslam2/devops-node-app:${{ github.sha }}
          docker push umairaslam2/devops-node-app:latest

#####################################
