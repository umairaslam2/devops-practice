# Workflow ka naam
name: CI/CD Pipeline

# Trigger
on:
  push:
    branches:
      - main

#####################################
# JOB 1: CI (Lint + Test)
#####################################
jobs:
  ci:
    name: Continuous Integration (Lint & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js (v18)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

#####################################
# JOB 2: Docker Build + Security + Push
#####################################
  docker:
    name: Docker Build, Security Scan & Push
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t umairaslam2/devops-node-app:${{ github.sha }} .
          docker tag umairaslam2/devops-node-app:${{ github.sha }} umairaslam2/devops-node-app:latest

      - name: Trivy Security Scan (Report Only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: umairaslam2/devops-node-app:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          exit-code: 0

      - name: Push Docker Image
        run: |
          docker push umairaslam2/devops-node-app:${{ github.sha }}
          docker push umairaslam2/devops-node-app:latest

#####################################
# JOB 3: Kubernetes Deploy + Rollback
#####################################
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      #################################
      # Step 1: Setup kubectl
      #################################
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      #################################
      # Step 2: Configure Kubeconfig
      #################################
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config

      #################################
      # Step 3: Update image in deployment
      #################################
      - name: Deploy new version
        run: |
          kubectl set image deployment/devops-node-app \
            devops-node-app=umairaslam2/devops-node-app:${{ github.sha }} \
            -n devops

      #################################
      # Step 4: Wait for rollout
      #################################
      - name: Verify rollout
        run: |
          kubectl rollout status deployment/devops-node-app -n devops

      #################################
      # Step 5: AUTO ROLLBACK ON FAILURE
      #################################
      - name: Rollback if deployment fails
        if: failure()
        run: |
          kubectl rollout undo deployment/devops-node-app -n devops
